name: Source checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg for decode and export tests
        run: choco install ffmpeg --yes --no-progress
      - name: Verify audio tools
        run: |
          Get-Command ffmpeg, ffprobe -ErrorAction Stop
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install -r requirements-test.txt
      - run: npm ci --prefix vendor/audiojs --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Compile Windows desktop host
        run: ./desktop/build.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'BedroomRestore')
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Restore-source
          path: dist/
          retention-days: 14
